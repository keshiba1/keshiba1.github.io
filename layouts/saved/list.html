{{ define "main" }}
<section>
  <h1>Saved posts</h1>
  <p class="post-meta">Posts you've bookmarked with the 🔖 Save button. These are saved only in this browser, on this device.</p>
  <ul class="post-list" id="saved-list"></ul>
  <p id="saved-empty" class="post-meta" style="display:none">You haven't saved any posts yet. Look for the 🔖 <strong>Save this post</strong> button on any post.</p>
</section>

<script>
(function () {
  var KEY = 'jc_saved_posts';
  var list;
  try { list = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { list = []; }
  var ul = document.getElementById('saved-list');
  var empty = document.getElementById('saved-empty');
  if (!list.length) { empty.style.display = 'block'; return; }
  list.forEach(function (p) {
    var li = document.createElement('li');
    var a = document.createElement('a');
    a.href = p.url;
    a.textContent = p.title;
    var time = document.createElement('time');
    time.textContent = p.date;
    li.appendChild(a);
    li.appendChild(time);
    ul.appendChild(li);
  });
})();
</script>
{{ end }}
