<!DOCTYPE html>
<html lang="{{ site.Language.LanguageCode | default "en-IN" }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <link rel="canonical" href="{{ .Permalink }}">
  {{ partial "seo-meta.html" . }}
  {{ block "head" . }}{{ end }}
  {{ partial "style.html" . }}
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="{{ "/" | relURL }}">{{ .Site.Title }}</a>
    <nav>
      <a href="{{ "/posts/" | relURL }}">Posts</a>
      <a href="{{ "/about/" | relURL }}">About</a>
      <a href="{{ .Site.Params.channelURL }}" rel="me noopener">YouTube</a>
    </nav>
  </header>
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  <footer class="site-footer">
    <p>&copy; {{ now.Year }} {{ .Site.Params.authorName }} · <a href="{{ "/sitemap.xml" | relURL }}">Sitemap</a> · <a href="{{ "/index.xml" | relURL }}">RSS</a> · <a href="{{ "/llms.txt" | relURL }}">llms.txt</a></p>
  </footer>
</body>
</html>
