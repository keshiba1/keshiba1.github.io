baseURL = "https://jasminechoudhari.com/"
title = "Jasmine Choudhari"
defaultContentLanguage = "en"

# Site-wide noindex: keeps crawlers from indexing the site while real
# content is still being built. Flip noindexSite=false in [params] and
# delete this disableKinds line when first real posts land.
disableKinds = ["sitemap"]

[languages.en]
  languageCode = "en-IN"
  languageName = "English"
  weight = 1

enableEmoji = false
enableGitInfo = false

[params]
  description = "Practical kitchen and home organization for Indian homes — small kitchens, rentals, 1BHKs, pantry organization, kitchen gadgets."
  authorName = "Jasmine Choudhari"
  authorPhoto = "/images/jasmine-silver-play-button.jpg"
  channelHandle = "@jasminechoudhari"
  channelURL = "https://www.youtube.com/@jasminechoudhari"
  instagramURL = "https://www.instagram.com/jasmine.choudhari"
  facebookURL = "https://www.facebook.com/jasminechoudhari12"
  youtubeSubscribers = 600000
  silverPlayButton = true
  channelStartYear = 2019
  noindexSite = true

[outputs]
  home = ["HTML", "RSS"]
  page = ["HTML"]
  section = ["HTML", "RSS"]

[markup.goldmark.renderer]
  unsafe = true

[markup.tableOfContents]
  startLevel = 2
  endLevel = 3

[permalinks]
  posts = "/posts/:slug/"

[taxonomies]
  tag = "tags"
  category = "categories"
